services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: joggly
      POSTGRES_USER: joggly
      POSTGRES_PASSWORD: joggly
    ports:
      # Host 5434, not 5432 -- this machine already runs a native Postgres on 5432.
      - "5434:5432"
    volumes:
      - joggly-postgres-data:/var/lib/postgresql/data

volumes:
  joggly-postgres-data:
